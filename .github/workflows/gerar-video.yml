name: Gerar vídeo (Destino Paralelo)

on:
  push:
    branches: [main]
    paths:
      - "videos/*/roteiro.py"
      - "pedidos.txt"
  workflow_dispatch:
    inputs:
      video:
        description: "Pasta do vídeo em videos/ (ex.: titan). Só os Shorts: titan:shorts"
        required: true

permissions:
  contents: write

env:
  # "1" = só imagens da Cloudflare (FLUX); se a cota diária acabar, NÃO monta vídeo com imagens fracas.
  # Troque por "0" para permitir completar com o modelo local (SD-Turbo, qualidade menor).
  SEM_LOCAL: "0"

concurrency:
  group: gerar-destino
  cancel-in-progress: false

jobs:
  descobrir:
    runs-on: ubuntu-latest
    outputs:
      itens: ${{ steps.quais.outputs.itens }}
      lotes: ${{ steps.quais.outputs.lotes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Descobrir o que gerar
        id: quais
        run: |
          if [ -n "${{ github.event.inputs.video }}" ]; then
            L="${{ github.event.inputs.video }}"
          else
            L=$(git diff --name-only HEAD~1 HEAD -- 'videos/*/roteiro.py' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if git diff --name-only HEAD~1 HEAD | grep -qx pedidos.txt; then
              L="$L $(grep -v '^#' pedidos.txt | tr '\n' ' ')"
            fi
          fi
          L=$(echo $L | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          echo "pedidos: $L"
          if [ -z "$(echo $L | tr -d ' ')" ]; then echo 'itens=[]' >> "$GITHUB_OUTPUT"; echo 'lotes=[]' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -m fabrica.descobrir "$L" > saida_desc.txt
          echo "itens=$(sed -n 1p saida_desc.txt)" >> "$GITHUB_OUTPUT"
          echo "lotes=$(sed -n 2p saida_desc.txt)" >> "$GITHUB_OUTPUT"
          cat saida_desc.txt
      - name: Preparar a GPU reserva na Modal (só se houver imagens a gerar e a chave existir)
        if: ${{ steps.quais.outputs.lotes != '[]' }}
        continue-on-error: true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then echo "Modal não configurada: pulando"; exit 0; fi
          pip install -q modal
          modal deploy fabrica/modal_flux.py

  imagens:
    needs: descobrir
    if: ${{ needs.descobrir.outputs.lotes != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lote: ${{ fromJSON(needs.descobrir.outputs.lotes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o básico
        run: pip install pillow modal
      - name: Gerar pela nuvem (FLUX - Cloudflare, depois Modal) - lote ${{ matrix.lote.lote }} de ${{ matrix.lote.total }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          case "${{ matrix.lote.modo }}" in shorts) S="--shorts";; miniaturas) S="--miniaturas";; *) S="";; esac
          python -m fabrica.imagens "videos/${{ matrix.lote.slug }}" $S --lote ${{ matrix.lote.lote }} --total ${{ matrix.lote.total }} --nuvem
      - name: Conferir o que falta
        id: resta
        run: |
          case "${{ matrix.lote.modo }}" in shorts) S="--shorts";; miniaturas) S="--miniaturas";; *) S="";; esac
          python -m fabrica.imagens "videos/${{ matrix.lote.slug }}" $S --lote ${{ matrix.lote.lote }} --total ${{ matrix.lote.total }} --contar
      - name: Cache dos modelos de imagem
        if: ${{ steps.resta.outputs.restam != '0' && env.SEM_LOCAL != '1' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-modelos-v1
      - name: Instalar o modelo local (só se a Cloudflare não deu conta de tudo)
        if: ${{ steps.resta.outputs.restam != '0' && env.SEM_LOCAL != '1' }}
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate peft
      - name: Completar com o modelo local (SD-Turbo)
        if: ${{ steps.resta.outputs.restam != '0' && env.SEM_LOCAL != '1' }}
        run: |
          nproc
          case "${{ matrix.lote.modo }}" in shorts) S="--shorts";; miniaturas) S="--miniaturas";; *) S="";; esac
          python -m fabrica.imagens "videos/${{ matrix.lote.slug }}" $S --lote ${{ matrix.lote.lote }} --total ${{ matrix.lote.total }} --local
      - uses: actions/upload-artifact@v4
        with:
          name: img-${{ matrix.lote.nome }}-${{ matrix.lote.lote }}
          path: trabalho/${{ matrix.lote.slug }}/img
          retention-days: 3

  montar:
    needs: [descobrir, imagens]
    # roda também quando o job de imagens foi pulado (todas as imagens vieram de você, sem nada a gerar)
    if: ${{ !cancelled() && needs.descobrir.result == 'success' && needs.descobrir.outputs.itens != '[]' && (needs.imagens.result == 'success' || needs.imagens.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.descobrir.outputs.itens) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar programas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig
          mkdir -p ~/.local/share/fonts && cp fonts/* ~/.local/share/fonts/ && fc-cache -f
          pip install kokoro-onnx==0.6.1 soundfile numpy pillow
      - name: Cache dos modelos de voz
        uses: actions/cache@v4
        with:
          path: modelos
          key: kokoro-v1.0
      - name: Baixar as imagens geradas
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: img-${{ matrix.item.nome }}-*
          path: trabalho/${{ matrix.item.slug }}/img
          merge-multiple: true
      - name: Montar o vídeo
        run: |
          nproc; ls trabalho/${{ matrix.item.slug }}/img | wc -l
          case "${{ matrix.item.modo }}" in shorts) S="--shorts";; miniaturas) S="--miniaturas";; *) S="";; esac
          python -m fabrica.pipeline "videos/${{ matrix.item.slug }}" $S
      - name: Link público do vídeo (Release do GitHub)
        if: ${{ !github.event.repository.private && github.ref_name == 'main' && matrix.item.modo != 'miniaturas' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ matrix.item.slug }}"
          if ! ls trabalho/$v/*.mp4 >/dev/null 2>&1; then echo "nenhum vídeo montado (faltaram imagens); sem Release"; exit 0; fi
          tag="video-$v-${{ matrix.item.modo }}-${{ github.run_number }}"
          if [ "${{ matrix.item.modo }}" = "shorts" ]; then
            for f in trabalho/$v/${v}_short_*.mp4; do
              n=$(basename "$f" .mp4); sid="${n##*_}"
              gh release create "$tag-$n" "$f" --title "$n" --notes "Short gerado pela fábrica do Destino Paralelo."
              url="https://github.com/${{ github.repository }}/releases/download/$tag-$n/$n.mp4"
              echo "link: $url"
              python -c "import json,sys; f='saida/$v/short_$sid.json'; d=json.load(open(f)); d['video_url']=sys.argv[1]; json.dump(d,open(f,'w'),indent=1,ensure_ascii=False)" "$url"
            done
          else
            gh release create "$tag" "trabalho/$v/$v.mp4" --title "Vídeo: $v" --notes "Gerado pela fábrica do Destino Paralelo."
            url="https://github.com/${{ github.repository }}/releases/download/$tag/$v.mp4"
            echo "link: $url"
            python -c "import json,sys; f='saida/$v/info.json'; d=json.load(open(f)); d['video_url']=sys.argv[1]; json.dump(d,open(f,'w'),indent=1,ensure_ascii=False)" "$url"
          fi
      - name: Salvar links e miniaturas no repositório
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add saida
          git commit -m "Vídeo pronto: ${{ matrix.item.nome }}" || { echo "nada novo"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin ${{ github.ref_name }} && git push && break
            sleep $((RANDOM % 10 + 3))
          done
