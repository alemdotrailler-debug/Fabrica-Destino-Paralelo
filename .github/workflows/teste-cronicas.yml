name: Teste imagens Cronicas
on:
  push:
    branches: [teste-cronicas]
    paths: ["teste_cronicas/gerar.py"]
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 teste_cronicas/gerar.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Salvar imagens
        run: |
          git config user.name "fabrica"; git config user.email "fabrica@users.noreply.github.com"
          git add teste_cronicas/saida
          git commit -m "Teste de imagens: Cronicas" || echo "nada"
          git push origin HEAD:teste-cronicas
